  <title
     id="title">AstroX</title>
  <desc
     id="desc">Logotipo AstroX que adapta sus colores al tema claro u oscuro.</desc>
  <style
     id="theme-colors"><![CDATA[
    #wordmark { fill: #0B1020; }
    #accent-start { stop-color: #0098D8; }
    #accent-end { stop-color: #5B52FF; }
    #orbit { opacity: 0.42; }

    @media (prefers-color-scheme: dark) {
      #wordmark { fill: #F7F9FF; }
      #accent-start { stop-color: #42E5FF; }
      #accent-end { stop-color: #9383FF; }
      #orbit { opacity: 0.66; }
    }
  ]]></style>
  <defs
     id="defs9">
    <linearGradient
       id="astrox-accent"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop
         offset="0"
         stop-color="#0098D8"
         id="accent-start" />
      <stop
         offset="1"
         stop-color="#5B52FF"
         id="accent-end" />
    </linearGradient>
  </defs>
  <!-- Órbita: conserva la idea original sin competir con la palabra. -->
  <path
     d="M 302,139 C 452,88 777,76 1008,126"
     fill="none"
     stroke="url(#astrox-accent)"
     stroke-width="9"
     stroke-linecap="round"
     opacity="0.42"
     id="orbit" />
